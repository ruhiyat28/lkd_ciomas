upstream flask_app {
    server app:5000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Static files langsung dari Nginx
    location /static/ {
        alias /app/static_src/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Uploads nasabah
    location /static/uploads/ {
        alias /app/static/uploads/;
        expires 1d;
        access_log off;
    }

    # Semua request ke Flask
    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        # Retry jika app belum ready
        proxy_next_upstream error timeout http_502 http_503;
    }
}

# Festival Ngabring 2026
server {
    listen 80;
    server_name festivalngabring.id www.festivalngabring.id;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        proxy_pass http://festival_ngabring:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
