<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Error - LKD Ciomas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="display-1 text-danger mb-4">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h1 class="fw-bold">Terjadi Kesalahan Server</h1>
            <p class="lead text-muted mb-4">
                Mohon maaf, sistem mengalami gangguan koneksi sementara. 
                Kami telah menyegarkan sesi Anda untuk memperbaiki masalah ini.
            </p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="{{ url_for('main.dashboard') if config.get('WTF_CSRF_ENABLED', True) else '/' }}" class="btn btn-primary btn-lg px-4 gap-3">
                    <i class="bi bi-arrow-clockwise me-2"></i>Ke Dashboard
                </a>
                <a href="/login" class="btn btn-outline-secondary btn-lg px-4">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login Ulang
                </a>
            </div>
            <p class="mt-5 small text-muted">
                Jika masalah berlanjut, silakan hubungi administrator sistem.
            </p>
        </div>
    </div>
</div>
</body>
</html>
