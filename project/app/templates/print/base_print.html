<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>{% block print_title %}Cetak{% endblock %}</title>
<style>
  @page { size: A4; margin: 15mm 15mm 15mm 20mm; }
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; font-size: 10pt; color: #000; margin: 0; }
  
  .kop {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 3px double #000; padding-bottom: 8px; margin-bottom: 12px;
  }
  .kop img { width: 55px; height: 55px; object-fit: contain; }
  .kop-text { flex: 1; }
  .kop-text .nama-lembaga { font-size: 13pt; font-weight: bold; letter-spacing: .5px; }
  .kop-text .alamat { font-size: 8.5pt; color: #333; line-height: 1.5; }
  
  .doc-title {
    text-align: center; font-size: 13pt; font-weight: bold;
    text-transform: uppercase; margin: 10px 0 4px;
    letter-spacing: 1px;
  }
  .doc-subtitle { text-align: center; font-size: 9pt; margin-bottom: 12px; }
  .doc-no { text-align: center; font-size: 9pt; margin-bottom: 16px; }
  
  table { width: 100%; border-collapse: collapse; }
  table.bordered td, table.bordered th { border: 1px solid #000; padding: 4px 6px; }
  table.info td { padding: 2px 6px; vertical-align: top; font-size: 9.5pt; }
  table.info td:first-child { width: 140px; font-weight: normal; }
  table.info td:nth-child(2) { width: 12px; }
  
  .ttd-area { display: flex; justify-content: space-between; margin-top: 24px; }
  .ttd-box { text-align: center; width: 160px; }
  .ttd-box .ttd-line { height: 45px; }
  .ttd-box .ttd-nama { font-weight: bold; font-size: 9pt; text-decoration: underline; }
  .ttd-box .ttd-jabatan { font-size: 8.5pt; }
  
  .kotak-nominal {
    border: 2px solid #000; padding: 8px 16px; text-align: center;
    font-size: 16pt; font-weight: bold; margin: 12px 0;
  }
  
  .terbilang { font-style: italic; font-size: 9pt; margin: 6px 0; border: 1px solid #ccc; padding: 4px 8px; background: #f9f9f9; }
  
  .cut-line { border-top: 1px dashed #999; margin: 16px 0; text-align: center; font-size: 8pt; color: #666; }
  
  .stamp-area { border: 2px dashed #999; width: 80px; height: 60px; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 7pt; color: #999; }
  
  .qr-ttd { width: 60px; height: 60px; margin: 4px auto 0; }
  .qr-ttd-img { width: 60px; height: 60px; }
  .ttd-box .ttd-qr { margin-top: 4px; }
  
  @media print { .no-print { display: none !important; } }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
<div class="no-print" style="padding:12px;background:#f3f4f6;margin-bottom:16px;display:flex;gap:8px;align-items:center;">
  <button onclick="window.print()" style="background:#1a56db;color:#fff;border:none;padding:7px 18px;border-radius:6px;cursor:pointer;font-weight:bold;">🖨️ Cetak</button>
  {% if back_url %}
  <a href="{{ back_url }}" style="background:#4b5563;color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;text-decoration:none;">← Kembali</a>
  {% else %}
  <button onclick="window.close()" style="background:#6b7280;color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;">✕ Tutup</button>
  {% endif %}
</div>

{% block content %}{% endblock %}

</body>
</html>
